name: build

# Continuous integration: build, test, and verify every push to main and every pull request, then
# deploy a green main build to GitHub Packages. The build, test, and AOT jobs live in ci.yml and are
# shared with release.yml, which deploys to nuget.org instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      # Main builds are numbered from the run as prereleases of the next patch, so every green build
      # is installable from GitHub Packages and sorts after the last release. Bump the base after
      # each release. Releases take their version from the release tag instead; see release.yml.
      version: 1.0.1-alpha.${{ github.run_number }}

  deploy:
    name: deploy to GitHub Packages
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/valence-works/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
