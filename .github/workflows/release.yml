name: release

# Publishing to nuget.org is effectively permanent: a package can be unlisted but never deleted, and
# a version number can never be reused. So this runs only when a GitHub release is published, never
# on a push, and it builds and verifies the tagged commit before it publishes.
#
# To release: draft a GitHub release with a new tag named v<version> (for example v1.0.0) and
# publish it. The tag decides the package version; nothing in the repository has to change.
#
# The Trusted Publishing policy on nuget.org names this file, so the deploy job has to stay in
# release.yml. Renaming the file breaks publishing until the policy is updated to match.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            v[0-9]*) echo "value=${TAG#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Release tag '$TAG' must be v<version>, for example v1.0.0 or v1.1.0-preview.1"; exit 1 ;;
          esac

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.value }}

  deploy:
    name: deploy to nuget.org
    needs: [version, ci]
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment to gate the publish behind an approval.
    environment: nuget
    permissions:
      contents: read
      # Lets the job request a short-lived OIDC token from GitHub, which nuget.org exchanges for a
      # temporary API key. No long-lived publishing credential exists anywhere in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Requested immediately before the push: the temporary key is valid for one hour, and one
      # token buys exactly one key.
      - name: Exchange the OIDC token for a temporary key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_ORG_USERNAME }}

      - name: Publish to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
